name: Suivi quotidien du prix

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tracker
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Relever le prix
        env:
          IGNAV_API_KEY: ${{ secrets.IGNAV_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PAGE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python tracker.py

      - name: Enregistrer l'historique
        run: |
          git config user.name "flight-tracker"
          git config user.email "flight-tracker@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "Relevé du $(date -u +%F)"
          git push
